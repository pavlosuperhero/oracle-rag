  - id: keep-hybrid
    based_on: [holdout-reproduction]
    decision: Keep BM25L, dense cosine and RRF as the default. Keep T5 opt-in.
    rationale: The four lost supporting hits are material for this holdout. The small synthetic sample leaves population effects uncertain.
  - id: minimize-context
    based_on: [compact-query-reproducer]
    decision: Use compact CLI previews and selective MCP fetch.
    rationale: Candidate metadata lets callers inspect matches before loading full passages. A citation identifies a passage, while the passage text determines whether it supports a claim.
  - id: verify-cost-on-real-workloads
    based_on: [holdout-reproduction]
    decision: Measure one representative corpus with real neural embeddings before making production cost claims.
    rationale: The offline fixture excludes embedding-server resource use and production query distributions.
