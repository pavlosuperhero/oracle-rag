[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"


[project]
name = "oracle-rag"
version = "0.1.0"
description = "In-memory hybrid document retrieval with Amazon bedrock, HTTP, MCP and openai api"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "boto3>=1.43.122",
    "fastapi>=0.162.0",
    "fonttools>=4.68.0",
    "httpx>=0.28.1",
    "mcp>=2.3.0",
    "numpy>=2.5.4",
    "pydantic>=2.14.2",
    "pypdf>=6.21.4",
    "pyyaml>=6.0.3",
    "rank-bm25>=0.2.2",
    "rich>=13",
    "typer>=0.27.3",
    "uvicorn>=0.54.0",
    "watchfiles>=1.3.0",
]


[project.scripts]
oracle = "cli:app"

[dependency-groups]
dev = [
  "boto3-stubs[bedrock-runtime]>=1.38,<2",
  "mypy>=1.15,<2",
  "pytest>=8.3,<10",
  "ruff>=0.11,<1",
  "types-beautifulsoup4>=4.12",
  "types-pyyaml>=6,<7"
]

[tool.hatch.build.targets.wheel]
only-include = [
    "src/configs", "src/data", "src/documents", "src/embeddings",
    "src/evaluation", "src/models", "src/runtime", "src/service", "src/storages",
    "src/cli.py",
]

sources = ["src"]

[tool.hatch.build.targets.wheel.force-include]
"sources.json" = "configs/sources.json"

[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/pyproject.toml", "/uv.lock", "/README.md", "/sources.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.14"
strict = true
files = ["src"]

[[tool.mypy.overrides]]
module = ["rank_bm25"]
ignore_missing_imports = true

